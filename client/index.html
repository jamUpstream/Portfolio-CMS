<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Portfolio CMS</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem('theme-mode') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          const settings = JSON.parse(localStorage.getItem('admin-theme-settings') || '{}');
          const isDark = mode === 'dark';
          const accent = settings.theme_primary_color || '#b45309';
          const background = isDark ? (settings.theme_dark_background_color || '#15130f') : (settings.theme_background_color || '#f6f0e7');
          const text = isDark ? (settings.theme_dark_text_color || '#f4eadc') : (settings.theme_text_color || '#1d1a16');
          const surface = isDark ? (settings.theme_dark_surface_color || '#1f1b17') : (settings.theme_surface_color || '#fffaf2');
          const root = document.documentElement;
          root.dataset.theme = mode;
          root.style.setProperty('--admin-theme-accent', accent);
          root.style.setProperty('--admin-theme-bg', background);
          root.style.setProperty('--admin-theme-text', text);
          root.style.setProperty('--admin-theme-panel', surface);
          root.style.setProperty('--admin-sidebar-active', accent);
          root.style.setProperty('--admin-sidebar-active-text', isDark ? '#fffaf2' : '#fffdf8');
          root.style.setProperty('--color-accent', accent);
          root.style.setProperty('--color-paper', background);
          root.style.setProperty('--color-ink', text);
          root.style.setProperty('--color-surface', surface);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
